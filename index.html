<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSTAFA SINDY // PS4 11.00 Host</title>
  <style>
    :root {
      --bg: #07090e; --card: #0f1420; --gold: #f5b942;
      --gold-glow: rgba(245, 185, 66, 0.35); --cyan: #38bdf8; --text: #e2e8f0; --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body {
      background: radial-gradient(circle at top, #131b2e 0%, var(--bg) 70%);
      color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .container {
      width: 90%; max-width: 720px; background: var(--card);
      border: 1px solid rgba(245, 185, 66, 0.25); border-radius: 16px; padding: 40px 32px; text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--gold-glow);
    }
    .brand-title {
      font-size: 42px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--gold), #ffffff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
    }
    .status-box {
      background: rgba(7, 9, 14, 0.9); border: 1px solid #1e293b;
      border-radius: 10px; padding: 16px; margin: 24px 0;
      font-family: monospace; font-size: 15px; color: var(--cyan);
    }
    button {
      background: linear-gradient(135deg, #d99b26, #f5b942); color: #07090e;
      border: none; padding: 18px 24px; border-radius: 10px;
      font-size: 18px; font-weight: 700; cursor: pointer; width: 100%;
      box-shadow: 0 0 20px var(--gold-glow); transition: 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="brand-title">Mustafa Sindy</h1>
    <p style="color: var(--muted); margin-bottom: 20px;">PS4 v11.00 GoldHEN Host Hub</p>

    <div class="status-box" id="status">
      [READY] Select payload to cache / trigger...
    </div>

    <button onclick="loadPayloadDirect()">⚡ LOAD GOLDHEN v2.4b18</button>
  </div>

  <script>
    function setStatus(msg, color = '#38bdf8') {
      const box = document.getElementById('status');
      box.style.color = color;
      box.textContent = msg;
    }

    async function loadPayloadDirect() {
      try {
        setStatus('[1/2] Loading goldhen.bin into browser cache...', '#f5b942');
        const res = await fetch('goldhen.bin');
        if (!res.ok) throw new Error('goldhen.bin missing in repo root!');
        const buffer = await res.arrayBuffer();

        setStatus(`[SUCCESS] Payload cached! (${buffer.byteLength} bytes). Run PPPwn via Ethernet to inject.`, '#4ade80');
      } catch (err) {
        setStatus(`[ERROR] ${err.message}`, '#f87171');
      }
    }
  </script>
</body>
</html>
