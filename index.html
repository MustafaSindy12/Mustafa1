<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUSTAFA SINDY // PS4 11.00 GoldHEN</title>
  <style>
    :root {
      --bg: #07090e;
      --card: #0f1420;
      --gold: #f5b942;
      --gold-glow: rgba(245, 185, 66, 0.35);
      --cyan: #38bdf8;
      --text: #e2e8f0;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #131b2e 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid rgba(245, 185, 66, 0.25);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px var(--gold-glow);
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(245, 185, 66, 0.12);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--gold), #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    .status-box {
      background: rgba(7, 9, 14, 0.9);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
      font-family: monospace;
      font-size: 15px;
      color: var(--cyan);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    button {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: var(--text);
      border: 1px solid rgba(245, 185, 66, 0.4);
      padding: 16px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--gold);
      color: #07090e;
      box-shadow: 0 0 20px var(--gold-glow);
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
      margin-top: 10px;
    }

    .footer span {
      color: var(--gold);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">PS4 Firmware 11.00 Host</div>
    <h1 class="brand-title">Mustafa Sindy</h1>
    <p class="subtitle">GoldHEN Payload Hub &amp; GitHub Host</p>

    <div class="status-box" id="status">
      [INFO] Host loaded from GitHub. Ready for PPPwn / BinLoader injection.
    </div>

    <div class="btn-grid">
      <button onclick="loadGoldHen()">
        ⚡ Load GoldHEN v2.4b18 (11.00)
      </button>
    </div>

    <div class="footer">
      Created by <span>Mustafa Sindy</span> · PS4 v11.00
    </div>
  </div>

  <script>
    function setStatus(msg, color = '#38bdf8') {
      const box = document.getElementById('status');
      box.style.color = color;
      box.textContent = msg;
    }

    function loadGoldHen() {
      setStatus('[CONNECTING] Requesting goldhen.bin...', '#f5b942');
      
      fetch('goldhen.bin')
        .then(res => {
          if (!res.ok) throw new Error('goldhen.bin not found in repository root!');
          return res.arrayBuffer();
        })
        .then(buffer => {
          setStatus(`[SUCCESS] GoldHEN loaded (${buffer.byteLength} bytes). Ready to inject!`, '#4ade80');
          // ده‌نگ و ڕه‌نگ بۆ فێرماوێرا ۱۱.۰۰ ده‌بێت ل ڕێکا پۆرتێ ۹۰۹۰ (BinLoader) یان PPPwn بهێته‌ هنارتن
        })
        .catch(err => {
          setStatus(`[ERROR] ${err.message}`, '#f87171');
        });
    }
  </script>

</body>
</html>
